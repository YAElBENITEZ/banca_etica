services:
  db:
    image: postgres:15-alpine
    container_name: mezcalpay_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mezcalpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: mezcalpay_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mezcalpay.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: